<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<script>
(() => {
'use strict';
// =====================================================================
//  STAR SHOOTER — single-file arcade shooter
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, SCALE = 1, EN = 1;
const SAFE = { top: 0, right: 0, bottom: 0, left: 0 };
const safeEl = document.getElementById('safe');
let isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
  (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
const LOWFX = isTouch; // lighter particle budget on phones
const MAXP = LOWFX ? 700 : 1400;

function readSafe() {
  try {
    const cs = getComputedStyle(safeEl);
    SAFE.top = parseFloat(cs.paddingTop) || 0; SAFE.right = parseFloat(cs.paddingRight) || 0;
    SAFE.bottom = parseFloat(cs.paddingBottom) || 0; SAFE.left = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
}
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  readSafe();
  SCALE = Math.max(0.7, Math.min(1.3, Math.min(W, H) / 600));
  EN = Math.max(0.85, SCALE);
  if (player) { player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 20, H - 20); }
  initStars();
}

// ---------- Utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
const TAU = Math.PI * 2;

// ---------- Storage ----------
let highScore = 0, storedHigh = 0;
try { highScore = parseInt(localStorage.getItem('starShooterHigh') || '0', 10) || 0; } catch (e) {}
storedHigh = highScore;
function saveHigh() { storedHigh = highScore; try { localStorage.setItem('starShooterHigh', String(highScore)); } catch (e) {} }

// =====================================================================
//  AUDIO — all procedural (Web Audio API)
// =====================================================================
const Sound = {
  ctx: null, master: null, sfx: null, music: null, muted: false, musicOn: true, noiseBuf: null,
  last: {}, laserNodes: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.8; this.master.connect(comp);
      this.sfx = c.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
      this.music = c.createGain(); this.music.gain.value = this.musicOn ? 0.32 : 0; this.music.connect(this.master);
      const len = c.sampleRate;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // iOS unlock: play a silent buffer inside the gesture
      const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
    } catch (e) { this.ctx = null; }
  },
  toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.8; if (this.muted) this.laser(false); },
  toggleMusic() { this.musicOn = !this.musicOn; if (this.music) this.music.gain.value = this.musicOn ? 0.32 : 0; },
  ok(name, gap) { // rate limiter
    if (!this.ctx || this.muted) return false;
    const t = this.ctx.currentTime;
    if (gap && this.last[name] && t - this.last[name] < gap) return false;
    this.last[name] = t; return true;
  },
  tone(type, f1, f2, dur, vol = 0.3, delay = 0, dest) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol = 0.4, freq = 1200, delay = 0, type = 'lowpass', dest, endFreq = 80) {
    if (!this.ctx || !this.noiseBuf) return;
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = rand(0.8, 1.2);
    const f = c.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(freq, t);
    if (type === 'lowpass') f.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t, rand(0, 0.3)); s.stop(t + dur + 0.02);
  },
  // ---- SFX ----
  shoot() { if (!this.ok('shoot', 0.05)) return; this.tone('square', 1400, 280, 0.07, 0.05); this.tone('triangle', 700, 160, 0.06, 0.06); },
  hit() { if (!this.ok('hit', 0.035)) return; this.tone('square', rand(260, 380), 110, 0.05, 0.06); },
  enemyShoot() { if (!this.ok('es', 0.06)) return; this.tone('triangle', 520, 180, 0.12, 0.05); },
  explode(size = 1) {
    if (!this.ok('ex', 0.03)) return;
    this.noise(0.25 + 0.15 * size, 0.3 + 0.1 * size, 3000, 0, 'lowpass');
    this.tone('sine', 190, 38, 0.28, 0.45);
    this.tone('square', 110, 30, 0.18, 0.08);
  },
  bigBoom() {
    if (!this.ok('bb', 0.2)) return;
    this.noise(1.6, 0.8, 4000, 0, 'lowpass', null, 40);
    this.tone('sine', 120, 20, 1.4, 0.7); this.tone('sawtooth', 240, 25, 1.1, 0.2);
    this.noise(0.8, 0.4, 6000, 0.15, 'highpass');
  },
  coin(n) {
    if (!this.ok('coin', 0.045)) return;
    const f = 988 * Math.pow(2, Math.min(n, 14) / 12);
    this.tone('sine', f, f, 0.07, 0.1); this.tone('sine', f * 1.5, f * 1.5, 0.14, 0.08, 0.05);
  },
  combo(m) { if (!this.ok('combo', 0.1)) return; const b = 440 * Math.pow(2, Math.min(m, 10) / 12); [0, 4, 7, 12, 16].forEach((s, i) => this.tone('square', b * Math.pow(2, s / 12), b * Math.pow(2, s / 12), 0.08, 0.07, i * 0.035)); },
  power() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone('square', f, f * 1.01, 0.09, 0.08, i * 0.045)); this.noise(0.3, 0.1, 8000, 0, 'highpass'); },
  newPower() { [1568, 2093, 2637].forEach((f, i) => this.tone('sine', f, f, 0.15, 0.06, 0.25 + i * 0.07)); },
  bomb() {
    this.noise(1.4, 0.9, 5000, 0, 'lowpass', null, 30);
    this.tone('sine', 70, 18, 1.6, 0.8); this.tone('sawtooth', 900, 40, 0.9, 0.18);
    this.tone('square', 60, 30, 0.6, 0.15, 0.05);
  },
  bombReady() { if (!this.ok('br', 1)) return; [784, 988, 1175].forEach((f, i) => this.tone('triangle', f, f, 0.12, 0.08, i * 0.06)); },
  hurt() { this.noise(0.55, 0.6, 1400); this.tone('sawtooth', 320, 40, 0.5, 0.28); this.tone('square', 160, 30, 0.4, 0.12); },
  shieldBreak() { this.tone('triangle', 1400, 200, 0.35, 0.18); this.noise(0.3, 0.25, 6000, 0, 'highpass'); },
  wave() { [392, 523, 659].forEach((f, i) => this.tone('triangle', f, f * 1.01, 0.16, 0.14, i * 0.09)); },
  clear() {
    [523, 659, 784, 1046].forEach((f, i) => this.tone('square', f, f, 0.1, 0.09, i * 0.08));
    [1046, 1318, 1568].forEach(f => this.tone('triangle', f, f, 0.6, 0.07, 0.34));
  },
  warning() { for (let i = 0; i < 3; i++) { this.tone('sawtooth', 330, 660, 0.3, 0.14, i * 0.42); this.tone('sawtooth', 660, 330, 0.1, 0.1, i * 0.42 + 0.3); } },
  roar() { this.tone('sawtooth', 90, 45, 0.9, 0.3); this.tone('square', 60, 40, 0.9, 0.15); this.noise(0.9, 0.35, 900); },
  bossDying() { for (let i = 0; i < 6; i++) this.tone('sawtooth', 600 - i * 70, 200 - i * 20, 0.2, 0.12, i * 0.2); },
  beam() { if (!this.ok('beam', 0.1)) return; this.tone('sawtooth', 1600, 90, 0.5, 0.14); this.noise(0.5, 0.2, 3000); },
  charge() { if (!this.ok('charge', 0.3)) return; this.tone('sine', 180, 1400, 0.8, 0.07); },
  missile() { if (!this.ok('mis', 0.12)) return; this.noise(0.12, 0.08, 2500, 0, 'bandpass'); this.tone('triangle', 900, 1300, 0.08, 0.03); },
  start() { [262, 392, 523, 784, 1046].forEach((f, i) => this.tone('square', f, f, 0.1, 0.09, i * 0.06)); },
  over() { [392, 330, 262, 196, 131].forEach((f, i) => this.tone('triangle', f, f * 0.97, 0.32, 0.18, i * 0.2)); },
  laser(on) {
    if (on && (!this.ctx || this.muted)) on = false;
    if (on && !this.laserNodes) {
      const c = this.ctx;
      const o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o1.type = 'sawtooth'; o1.frequency.value = 110; o2.type = 'square'; o2.frequency.value = 223;
      f.type = 'lowpass'; f.frequency.value = 1500; f.Q.value = 6;
      g.gain.value = 0.0001; g.gain.linearRampToValueAtTime(0.07, c.currentTime + 0.05);
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfx); o1.start(); o2.start();
      this.laserNodes = { o1, o2, f, g };
    } else if (!on && this.laserNodes) {
      const n = this.laserNodes, t = this.ctx.currentTime;
      try { n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(n.g.gain.value, t); n.g.gain.linearRampToValueAtTime(0.0001, t + 0.06); n.o1.stop(t + 0.08); n.o2.stop(t + 0.08); } catch (e) {}
      this.laserNodes = null;
    }
    if (this.laserNodes) this.laserNodes.f.frequency.value = 1200 + Math.sin(performance.now() / 40) * 500;
  },

  // ---- Procedural music: 4-bar loop, synthwave-ish. Boss mode = faster, darker ----
  mus: { playing: false, step: 0, next: 0, timer: null, boss: false },
  startMusic() {
    if (!this.ctx || this.mus.playing) return;
    this.mus.playing = true; this.mus.step = 0; this.mus.next = this.ctx.currentTime + 0.06;
    this.mus.timer = setInterval(() => this.schedule(), 25);
  },
  stopMusic() { this.mus.playing = false; if (this.mus.timer) clearInterval(this.mus.timer); this.mus.timer = null; },
  schedule() {
    if (!this.ctx || !this.mus.playing) return;
    const bpm = this.mus.boss ? 148 : 124, sd = 60 / bpm / 4;
    if (this.mus.next < this.ctx.currentTime - 0.2) this.mus.next = this.ctx.currentTime + 0.02; // resync after stalls
    while (this.mus.next < this.ctx.currentTime + 0.12) {
      if (this.musicOn && !this.muted) this.playStep(this.mus.step, this.mus.next - this.ctx.currentTime, sd);
      this.mus.next += sd; this.mus.step = (this.mus.step + 1) % 64;
    }
  },
  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  playStep(s, d, sd) {
    const boss = this.mus.boss, M = this.music;
    const prog = boss ? [45, 46, 45, 44] : [45, 41, 48, 43];
    const chords = boss ? [[0, 3, 6, 10], [0, 4, 7, 11], [0, 3, 7, 10], [0, 4, 7, 10]] : [[0, 3, 7, 12], [0, 4, 7, 12], [0, 4, 7, 11], [0, 4, 7, 10]];
    const bar = Math.floor(s / 16), i = s % 16, root = prog[bar], ch = chords[bar];
    if (i % 4 === 0) this.tone('sine', 160, 42, 0.22, 0.55, d, M);                    // kick
    if (i === 4 || i === 12) this.noise(0.14, 0.22, 1800, d, 'highpass', M);          // snare
    if (i % 2 === 1) this.noise(0.035, i % 4 === 3 ? 0.09 : 0.05, 8000, d, 'highpass', M); // hats
    if (boss && i % 4 === 2) this.noise(0.03, 0.05, 9000, d, 'highpass', M);
    if (i % 2 === 0) { // bass
      const off = [0, 0, 12, 0, 0, 12, 7, 12][i / 2];
      const f = this.mtof(root + off - 12);
      this.tone('sawtooth', f, f, sd * 1.7, 0.11, d, M);
      this.tone('square', f / 2, f / 2, sd * 1.7, 0.05, d, M);
    }
    // arp
    const n = root + 24 + ch[i % 4] + ((i >> 2) % 2 ? 12 : 0);
    const af = this.mtof(n);
    this.tone(boss ? 'sawtooth' : 'square', af, af, sd * 0.85, boss ? 0.025 : 0.03, d, M);
    if (i === 0) { const pf = this.mtof(root + 12 + ch[1]); this.tone('triangle', pf, pf, sd * 14, 0.05, d, M); } // pad note
  }
};

const keys = {};
const touch = { active: false, id: null, tx: 0, ty: 0 };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  Sound.init();
  if (!keys[k]) onKeyPress(k);
  keys[k] = true;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch.active = false; if (state === 'play') state = 'paused'; });

function onKeyPress(k) {
  if (k === 'm') { Sound.toggle(); return; }
  if (k === 'n') { Sound.toggleMusic(); return; }
  if (k === ' ' || k === 'enter') {
    if (state === 'title') startGame();
    else if (state === 'over' && overTimer <= 0) startGame();
  }
  if ((k === 'b' || k === 'x' || k === 'shift') && state === 'play') triggerBomb();
  if (k === 'p' || k === 'escape') {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
}

const BTN = 48;
function btnRects() {
  const y = SAFE.top + 8, x2 = W - SAFE.right - 8 - BTN;
  return { pause: { x: x2, y, w: BTN, h: BTN }, mute: { x: x2 - BTN - 10, y, w: BTN, h: BTN } };
}
function bombBtn() { const r = 34; return { x: W - SAFE.right - r - 16, y: H - SAFE.bottom - r - 16, r }; }
function hitBtn(r, x, y) { const pad = 10; return x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - pad && y <= r.y + r.h + pad; }
function hitBomb(x, y) { const b = bombBtn(); return (x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + 14) ** 2; }
function fingerOffset() { return Math.max(70, 85 * SCALE); } // ship sits above the finger

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); Sound.init(); isTouch = true;
  const t = e.changedTouches[0];
  if (state === 'title') { startGame(); }
  else if (state === 'over') { if (overTimer <= 0) startGame(); return; }
  else {
    const b = btnRects();
    if (hitBtn(b.pause, t.clientX, t.clientY)) { state = state === 'play' ? 'paused' : 'play'; touch.active = false; return; }
    if (hitBtn(b.mute, t.clientX, t.clientY)) { Sound.toggle(); return; }
    if (state === 'paused') { state = 'play'; }
    else if (hitBomb(t.clientX, t.clientY) && player && player.bomb >= 1) { triggerBomb(); return; }
  }
  if (touch.active) return; // ignore extra fingers
  touch.active = true; touch.id = t.identifier;
  touch.tx = t.clientX; touch.ty = t.clientY - fingerOffset();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.tx = t.clientX; touch.ty = t.clientY - fingerOffset(); }
}, { passive: false });
const endTouch = e => { Sound.init(); for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.active = false; touch.id = null; } };
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);
canvas.addEventListener('mousedown', e => {
  if (isTouch && e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  Sound.init();
  if (state === 'title') startGame();
  else if (state === 'over' && overTimer <= 0) startGame();
  else if (state === 'play' || state === 'paused') {
    const b = btnRects();
    if (hitBtn(b.pause, e.clientX, e.clientY)) state = state === 'play' ? 'paused' : 'play';
    else if (hitBtn(b.mute, e.clientX, e.clientY)) Sound.toggle();
    else if (state === 'play' && hitBomb(e.clientX, e.clientY)) triggerBomb();
  }
});

window.addEventListener('resize', resize);

if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play') state = 'paused'; touch.active = false; Sound.stopMusic(); Sound.laser(false); } });
['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

let stars = [];
function initStars() {
  stars = [];
  const n = Math.min(400, Math.floor((W * H) / 3500));
  for (let i = 0; i < n; i++) {
    const layer = Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2;
    stars.push({ x: Math.random() * W, y: Math.random() * H, layer,
      hue: [200, 280, 320, 180][Math.floor(Math.random() * 4)], tw: Math.random() * TAU });
  }
}
function updateStars(dt, speedMul) {
  for (const s of stars) {
    s.y += [20, 55, 130][s.layer] * speedMul * dt; s.tw += dt * 3;
    if (s.y > H) { s.y -= H; s.x = Math.random() * W; }
  }
}
function drawStars(speedMul) {
  for (const s of stars) {
    const size = [0.8, 1.4, 2.2][s.layer];
    const a = [0.4, 0.65, 0.95][s.layer] * (0.75 + 0.25 * Math.sin(s.tw));
    ctx.fillStyle = `hsla(${s.hue},100%,85%,${a})`;
    if (s.layer === 2) ctx.fillRect(s.x - size / 2, s.y - size * 2 * speedMul, size, size * 4 * speedMul);
    else ctx.fillRect(s.x, s.y, size, size);
  }
}

// =====================================================================
//  GLOW SPRITE CACHE (fast neon on phones: shadowBlur rendered once)
// =====================================================================
const spriteCache = {};
function sprite(key, w, h, pad, draw) {
  if (spriteCache[key]) return spriteCache[key];
  const k = 2, c = document.createElement('canvas');
  c.width = Math.ceil((w + pad * 2) * k); c.height = Math.ceil((h + pad * 2) * k);
  const g = c.getContext('2d'); g.scale(k, k); g.translate(pad + w / 2, pad + h / 2);
  draw(g);
  return (spriteCache[key] = { c, w: w + pad * 2, h: h + pad * 2 });
}
function orbSprite(color, r) {
  return sprite('orb' + color + r, r * 2, r * 2, 12, g => {
    g.shadowColor = color; g.shadowBlur = 12; g.fillStyle = color;
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.shadowBlur = 0; g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, r * 0.45, 0, TAU); g.fill();
  });
}
function boltSprite(color) {
  return sprite('bolt' + color, 4, 18, 10, g => {
    g.shadowColor = color; g.shadowBlur = 10; g.fillStyle = color; g.fillRect(-2, -9, 4, 18);
    g.shadowBlur = 0; g.fillStyle = '#fff'; g.fillRect(-1, -8, 2, 16);
  });
}
function coinSprite() {
  return sprite('coin', 16, 16, 10, g => {
    g.shadowColor = '#ffd23f'; g.shadowBlur = 12; g.fillStyle = '#ffd23f';
    g.beginPath(); g.arc(0, 0, 8, 0, TAU); g.fill();
    g.shadowBlur = 0; g.strokeStyle = '#fff6c2'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, 5, 0, TAU); g.stroke();
    g.fillStyle = '#fff6c2'; g.fillRect(-1, -3.5, 2, 7);
  });
}
function blit(s, x, y, sx = 1, sy = 1) { ctx.drawImage(s.c, x - s.w * sx / 2, y - s.h * sy / 2, s.w * sx, s.h * sy); }

// =====================================================================
let state = 'title';
let player = null, bullets = [], missiles = [], eBullets = [], enemies = [], particles = [], rings = [];
let powerups = [], coins = [], floaters = [], banner = null, timers = [], beams = [];
let score = 0, lives = 3, wave = 0, waveQueue = [], spawnTimer = 0, waveDelay = 1, shake = 0, overTimer = 0;
let flash = 0, flashColor = '255,255,255', time = 0, slowmo = 0, timeScale = 1, hitstop = 0;
let combo = 0, comboTimer = 0, mult = 1, bestMult = 1, coinCount = 0, coinChain = 0, coinChainT = 0;
let waveDamaged = false, waveCleared = true, seenPowers = new Set(), newHigh = false, kills = 0;

const POWERS = {
  rapid:  { color: '#39ff14', label: 'R', name: 'RAPID FIRE',      desc: 'FASTER SHOTS',     dur: 10, w: 3 },
  spread: { color: '#00aaff', label: 'S', name: 'SPREAD SHOT',     desc: '5-WAY FIRE',       dur: 10, w: 3 },
  shield: { color: '#ff66ff', label: 'O', name: 'SHIELD',          desc: 'BLOCKS ONE HIT',   dur: 14, w: 2.2 },
  homing: { color: '#ff9f1c', label: 'H', name: 'HOMING MISSILES', desc: 'SEEK & DESTROY',   dur: 10, w: 2 },
  laser:  { color: '#ff2a6d', label: 'L', name: 'LASER BEAM',      desc: 'PIERCING BEAM',    dur: 7,  w: 1.6 },
  magnet: { color: '#ffe600', label: 'M', name: 'COIN MAGNET',     desc: 'PULLS IN COINS',   dur: 14, w: 2 },
  bomb:   { color: '#ffffff', label: 'B', name: 'MEGA BOMB',       desc: 'BOMB CHARGED!',    dur: 0,  w: 1.1 }
};
const TIMED = ['rapid', 'spread', 'shield', 'homing', 'laser', 'magnet'];
const BOSSES = [
  { name: 'WARDEN', color: '#ff3355' },
  { name: 'HYDRA', color: '#7dff3a' },
  { name: 'VOID EYE', color: '#b04bff' }
];

function startGame() {
  Sound.init(); Sound.start();
  player = { x: W / 2, y: H - SAFE.bottom - Math.max(120, H * 0.2), r: 14, fireCd: 0, misCd: 0, invuln: 2, bomb: 0.35, tilt: 0,
    pw: { rapid: 0, spread: 0, shield: 0, homing: 0, laser: 0, magnet: 0 }, lasering: false };
  bullets = []; missiles = []; eBullets = []; enemies = []; particles = []; rings = []; powerups = []; coins = [];
  floaters = []; timers = []; beams = []; banner = null;
  score = 0; lives = 3; wave = 0; waveQueue = []; spawnTimer = 0; waveDelay = 1; shake = 0; flash = 0;
  slowmo = 0; timeScale = 1; hitstop = 0;
  combo = 0; comboTimer = 0; mult = 1; bestMult = 1; coinCount = 0; coinChain = 0; kills = 0;
  waveDamaged = false; waveCleared = true; seenPowers = new Set(); newHigh = false; overTimer = 0;
  touch.active = false;
  state = 'play';
}

function showBanner(text, sub, color, dur = 2.2, warn = false) { banner = { text, sub, color, life: dur, max: dur, warn }; }
function popup(x, y, text, color, size = 14, life = 0.9) {
  floaters.push({ x: clamp(x, 60, W - 60), y, text, color, size, life, max: life });
  if (floaters.length > 60) floaters.shift();
}
function after(t, fn) { timers.push({ t, fn }); }
function bossAlive() { for (const e of enemies) if (e.type === 'boss' && !e.dead) return e; return null; }

function nextWave() {
  wave++; waveQueue = []; waveCleared = false; waveDamaged = false;
  if (wave % 5 === 0) {
    const lvl = wave / 5, d = BOSSES[(lvl - 1) % 3];
    waveQueue.push({ type: 'boss', delay: 2.4 });
    showBanner('WARNING', d.name + bossSuffix(lvl) + ' APPROACHING', '#ff3355', 2.8, true);
    Sound.warning(); vibrate([100, 80, 100, 80, 100]);
  } else {
    const count = 6 + wave * 2;
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      let type = 'drifter';
      if (wave >= 2 && r < 0.25 + wave * 0.03) type = 'zigzag';
      if (wave >= 3 && r < 0.12 + wave * 0.025) type = 'shooter';
      if (wave >= 2 && type === 'drifter' && Math.random() < 0.12) type = 'vform';
      waveQueue.push({ type, delay: Math.max(0.25, 0.85 - wave * 0.05) * rand(0.6, 1.4) });
    }
    showBanner('WAVE ' + wave, wave === 1 ? 'GET READY!' : ['HERE THEY COME!', 'STAY SHARP!', 'LOCK AND LOAD!', 'KEEP IT UP!'][wave % 4], '#ffdd55', 2);
    Sound.wave();
  }
}
function bossSuffix(lvl) { const mk = Math.floor((lvl - 1) / 3); return mk ? ' MK ' + ['II', 'III', 'IV', 'V', 'VI'][Math.min(mk - 1, 4)] : ''; }

function spawnEnemy(type, x, y) {
  const diff = 1 + (wave - 1) * 0.08;
  let e;
  switch (type) {
    case 'vform': {
      const cx = rand(80, W - 80), vy = 95 * diff;
      for (let k = -2; k <= 2; k++) spawnEnemy('drifter', clamp(cx + k * 30 * EN, 20, W - 20), -30 - Math.abs(k) * 26);
      for (let k = enemies.length - 5; k < enemies.length; k++) { enemies[k].vx = 0; enemies[k].vy = vy; }
      return;
    }
    case 'drifter':
      e = { type, x: x != null ? x : rand(30, W - 30), y: y != null ? y : -30, vx: rand(-30, 30), vy: rand(70, 110) * diff, r: 14 * EN, hp: 1, color: '#00f0ff', pts: 100, coins: 1 }; break;
    case 'zigzag':
      e = { type, x: rand(60, W - 60), y: -30, vy: rand(80, 120) * diff, amp: rand(40, Math.min(120, W * 0.2)), freq: rand(2, 3.5), r: 13 * EN, hp: 2, color: '#ff2fd6', pts: 150, coins: randi(1, 2) }; e.baseX = e.x; break;
    case 'shooter':
      e = { type, x: rand(50, W - 50), y: -30, vy: 90, stopY: rand(SAFE.top + H * 0.15, H * 0.42), r: 17 * EN, hp: 3 + Math.floor(wave / 4), color: '#ffb300', pts: 250, coins: randi(2, 3), fireCd: rand(1, 2), vx: rand(-60, 60) }; break;
    case 'boss': {
      const lvl = wave / 5, v = (lvl - 1) % 3, mk = Math.floor((lvl - 1) / 3), hp = 80 + lvl * 50;
      e = { type, v, mk, lvl, name: BOSSES[v].name + bossSuffix(lvl), color: BOSSES[v].color, x: W / 2, y: -140,
        stopY: SAFE.top + Math.max(175, H * 0.22), r: 52 * EN, hp, maxHp: hp, atkT: 1.5, atk: 0, spin: 0, stream: null,
        pts: 5000 * lvl, coins: 40, entered: false, raged: false, dying: 0 };
      Sound.mus.boss = true;
      break;
    }
  }
  e.t = 0; e.flash = 0; e.dead = false;
  enemies.push(e);
}

// ---------- FX ----------
function addShake(v) { shake = Math.min(28, shake + v); }
function doFlash(a, color = '255,255,255') { flash = Math.max(flash, a); flashColor = color; }
function spark(x, y, color, n, speed, life, streak = true) {
  if (LOWFX) n = Math.ceil(n * 0.6);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = speed * (0.25 + Math.random() * 0.75);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: life * rand(0.5, 1), max: life, color, size: rand(1.5, 3.2), streak });
  }
  if (particles.length > MAXP) particles.splice(0, particles.length - MAXP);
}
function ring(x, y, max, color, life = 0.45, width = 3) { rings.push({ x, y, max, color, life, maxLife: life, width }); if (rings.length > 40) rings.shift(); }
function explosion(x, y, color, size = 1) {
  spark(x, y, color, 22 * size, 260 * Math.sqrt(size), 0.75);
  spark(x, y, '#ffffff', 8 * size, 160 * Math.sqrt(size), 0.4, false);
  ring(x, y, 46 * size, color, 0.4); ring(x, y, 22 * size, '#ffffff', 0.25, 6);
  addShake(3 * size);
}

// ---------- Combat ----------
function firePlayer() {
  const p = player, speed = -760;
  if (p.pw.spread > 0) {
    for (const a of [-0.3, -0.15, 0, 0.15, 0.3]) bullets.push({ x: p.x, y: p.y - 16, vx: Math.sin(a) * -speed, vy: Math.cos(a) * speed, dmg: 1 });
  } else {
    bullets.push({ x: p.x - 7, y: p.y - 14, vx: 0, vy: speed, dmg: 1 });
    bullets.push({ x: p.x + 7, y: p.y - 14, vx: 0, vy: speed, dmg: 1 });
  }
  p.fireCd = p.pw.rapid > 0 ? 0.07 : 0.17;
  Sound.shoot();
}
function enemyFire(x, y, angle, speed = 220, color = '#ffdd55', r = 5) {
  if (eBullets.length > 260) return;
  eBullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r, color });
}
function aimAt(x, y) { return Math.atan2(player.y - y, player.x - x); }

function damageEnemy(e, dmg, hx, hy) {
  if (e.dead || e.dying > 0 || (e.type === 'boss' && !e.entered)) return;
  e.hp -= dmg; if (dmg >= 1 || Math.random() < 0.2) e.flash = 0.07;
  if (hx != null && Math.random() < 0.7) spark(hx, hy, e.color, 3, 140, 0.3);
  if (e.type === 'boss') addShake(0.6);
  Sound.hit();
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.type === 'boss') { startBossDeath(e); return; }
  e.dead = true; kills++;
  combo++; comboTimer = 2.6;
  const nm = Math.min(8, 1 + Math.floor(combo / 4));
  if (nm > mult) {
    mult = nm; bestMult = Math.max(bestMult, mult);
    popup(e.x, e.y - 30, 'x' + mult + ' COMBO!', ['#fff', '#fff', '#39ff14', '#00f0ff', '#ffdd55', '#ff9f1c', '#ff2fd6', '#ff3355', '#ffffff'][mult], 22 + mult * 2, 1.3);
    Sound.combo(mult);
  }
  const pts = e.pts * mult; score += pts;
  popup(e.x, e.y, '+' + pts, e.color, 13 + Math.min(mult, 6));
  explosion(e.x, e.y, e.color, e.type === 'shooter' ? 1.4 : 1);
  Sound.explode(e.type === 'shooter' ? 1.5 : 1);
  dropCoins(e.x, e.y, e.coins);
  player.bomb = Math.min(1, player.bomb + 0.035);
  if (Math.random() < 0.08 + (e.type === 'shooter' ? 0.1 : 0)) dropPower(e.x, e.y);
}

function startBossDeath(e) {

function dropCoins(x, y, n, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), s = rand(spd * 0.3, spd);

  if (coins.length > 250) coins.splice(0, coins.length - 250);

function dropPower(x, y) {
  const types = Object.keys(POWERS).filter(k => !(k === 'bomb' && player.bomb >= 1));
  let total = 0; for (const k of types) total += POWERS[k].w;
  let r = Math.random() * total, type = types[0];
  for (const k of types) { r -= POWERS[k].w; if (r <= 0) { type = k; break; } }

  if (isNew) Sound.newPower();

function triggerBomb() {

  if (!p || state !== 'play' || p.bomb < 1) return;
  p.bomb = 0;
  ring(p.x, p.y, Math.max(W, H) * 1.2, '#ffffff', 0.8, 10); ring(p.x, p.y, Math.max(W, H) * 0.9, '#00f0ff', 0.65, 6); ring(p.x, p.y, Math.max(W, H) * 0.6, '#ff2fd6', 0.5, 4);

  eBullets = []; beams = [];
  for (const e of enemies) {
    if (e.type === 'boss') damageEnemy(e, e.maxHp * 0.12, e.x, e.y);

function hurtPlayer() {
  const p = player;
  if (p.invuln > 0) return;
  if (p.pw.shield > 0) {
    p.pw.shield = 0; p.invuln = 1;
    spark(p.x, p.y, '#ff66ff', 34, 300, 0.6); ring(p.x, p.y, 90, '#ff66ff', 0.4, 5);
    addShake(9); Sound.shieldBreak(); vibrate(40); return;
  }

  combo = 0; mult = 1; comboTimer = 0;

function gameOver() {
  state = 'over'; overTimer = 1.2; Sound.laser(false); Sound.stopMusic();
  if (score > storedHigh) { highScore = Math.max(highScore, score); newHigh = true; saveHigh(); }
  Sound.over();

function collectPower(u) {
  const p = player, def = POWERS[u.type];
  if (u.type === 'bomb') { p.bomb = 1; Sound.bombReady(); }
  else p.pw[u.type] = Math.max(p.pw[u.type], def.dur);
  popup(u.x, u.y - 10, def.name + '!', def.color, 18, 1.3);
  if (u.isNew) popup(u.x, u.y + 14, def.desc, '#ffffff', 12, 1.6);
  spark(u.x, u.y, def.color, 26, 220, 0.6); ring(u.x, u.y, 60, def.color, 0.35);

//  BOSS AI — three distinct bosses, enrage phase, scaling per cycle

function bossTurrets(e) { return [[-0.95, 0.25], [0, 0.65], [0.95, 0.25]].map(([a, b]) => ({ x: e.x + a * e.r, y: e.y + b * e.r })); }

function update(rdt) {

    const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;

    for (const e of enemies) {

    if (hitE) { damageEnemy(hitE, 3, m.x, m.y); ring(m.x, m.y, 26, '#ff9f1c', 0.25); spark(m.x, m.y, '#ff9f1c', 8, 180, 0.4); missiles.splice(i, 1); continue; }

    else u.y += u.vy * dt;
    if (u.y > H + 30) { powerups.splice(i, 1); continue; }
    if (dist2(u, p) < (u.r + p.r + 4) ** 2) { collectPower(u); powerups.splice(i, 1); }
  }
  if (score > highScore) highScore = score;
}

// =====================================================================
//  DRAW
// =====================================================================
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function rrect(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

function drawText(text, x, y, size, color, align = 'center', blur = 18, maxW = 0) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  if (maxW > 0) { const w = ctx.measureText(text).width; if (w > maxW) { size = Math.max(8, size * maxW / w); ctx.font = `bold ${size}px "Courier New", monospace`; } }
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  glow(color, blur); ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function drawShip(x, y, tilt, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.scale(SCALE, SCALE); ctx.globalAlpha = alpha;
  const fl = 10 + Math.random() * 10;
  glow('#00f0ff', 20); ctx.fillStyle = '#7ff9ff';
  ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(5, 12); ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#00f0ff';
  const t = (tilt || 0) * 4;
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(14 - t, 12); ctx.lineTo(5, 7); ctx.lineTo(-5, 7); ctx.lineTo(-14 - t, 12); ctx.closePath();
  ctx.fillStyle = 'rgba(0,240,255,0.18)'; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(3, 2); ctx.lineTo(-3, 2); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const hit = e.flash > 0;
  const col = hit ? '#ffffff' : e.color;
  if (hit) ctx.scale(1.15, 1.15);
  glow(e.color, hit ? 30 : 18); ctx.strokeStyle = col; ctx.lineWidth = 2.5;
  ctx.fillStyle = hit ? 'rgba(255,255,255,0.5)' : e.color + '22';
  const r = e.r;
  ctx.beginPath();
  if (e.type === 'drifter') {
    ctx.rotate(e.t * 2);
    ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, TAU); ctx.stroke();
  } else if (e.type === 'zigzag') {
    ctx.rotate(Math.cos(e.t * e.freq) * 0.4);
    ctx.moveTo(0, r); ctx.lineTo(r, -r * 0.6); ctx.lineTo(r * 0.35, -r * 0.2); ctx.lineTo(0, -r);
    ctx.lineTo(-r * 0.35, -r * 0.2); ctx.lineTo(-r, -r * 0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (e.type === 'shooter') {
    for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + Math.PI / 6 + e.t * 0.5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    const charge = e.fireCd < 0.4 ? 1 + (0.4 - e.fireCd) * 1.5 : 1;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.4 * charge, 0, TAU); ctx.fillStyle = col; ctx.fill();
  } else if (e.type === 'boss') drawBoss(e, col, hit);
  ctx.restore();
}

function drawBoss(e, col, hit) {
  const r = e.r, t = e.t;
  const c = e.raged && !hit ? (Math.floor(t * 8) % 2 ? e.color : '#ffffff') : col;
  if (e.dying > 0 && Math.floor(t * 20) % 2) ctx.globalAlpha = 0.5;
  ctx.lineWidth = 3.5; glow(e.color, 34); ctx.strokeStyle = c;
  ctx.beginPath();
  if (e.v === 0) { // WARDEN
    ctx.moveTo(0, r * 0.9); ctx.lineTo(r, r * 0.1); ctx.lineTo(r * 1.3, -r * 0.5); ctx.lineTo(r * 0.5, -r * 0.3);
    ctx.lineTo(0, -r * 0.8); ctx.lineTo(-r * 0.5, -r * 0.3); ctx.lineTo(-r * 1.3, -r * 0.5); ctx.lineTo(-r, r * 0.1); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.save(); ctx.rotate(t * 1.5); ctx.strokeStyle = '#ffdd55'; glow('#ffdd55', 20);
    ctx.beginPath(); for (let k = 0; k < 3; k++) { const a = k / 3 * TAU; ctx.lineTo(Math.cos(a) * r * 0.35, Math.sin(a) * r * 0.35); } ctx.closePath(); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.12 + Math.sin(t * 8) * 2, 0, TAU); ctx.fillStyle = c; ctx.fill();
  } else if (e.v === 1) { // HYDRA
    ctx.moveTo(-r * 1.25, -r * 0.1); ctx.lineTo(-r * 0.6, -r * 0.7); ctx.lineTo(r * 0.6, -r * 0.7); ctx.lineTo(r * 1.25, -r * 0.1);
    ctx.lineTo(r * 0.8, r * 0.45); ctx.lineTo(0, r * 0.8); ctx.lineTo(-r * 0.8, r * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke();
    for (const [a, b] of [[-0.95, 0.25], [0, 0.65], [0.95, 0.25]]) {
      const tx = a * r, ty = b * r, ang = Math.atan2(player.y - (e.y + ty), player.x - (e.x + tx));
      ctx.beginPath(); ctx.arc(tx, ty, r * 0.22, 0, TAU); ctx.fillStyle = '#05010f'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(ang) * r * 0.35, ty + Math.sin(ang) * r * 0.35); ctx.stroke();
    }
    ctx.save(); ctx.rotate(-t * 2); ctx.strokeStyle = '#d4ff6b';
    ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; ctx.lineTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3 - r * 0.1); } ctx.closePath(); ctx.stroke(); ctx.restore();
  } else { // VOID EYE
    ctx.save(); ctx.rotate(t * 0.8);
    for (let k = 0; k < 14; k++) { const a = k / 14 * TAU; const rr = k % 2 ? r * 1.0 : r * 1.25; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.75, r * 0.45, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill(); ctx.stroke();
    const ang = Math.atan2(player.y - e.y, player.x - e.x), ix = Math.cos(ang) * r * 0.3, iy = Math.sin(ang) * r * 0.15;
    const charging = beams.some(b => b.warn > 0);
    ctx.beginPath(); ctx.arc(ix, iy, r * 0.28, 0, TAU); ctx.fillStyle = charging ? '#ff3355' : c; ctx.fill();
    ctx.beginPath(); ctx.arc(ix, iy, r * 0.12, 0, TAU); ctx.fillStyle = '#05010f'; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPower(u) {
  const def = POWERS[u.type];
  ctx.save(); ctx.translate(u.x, u.y);
  const pr = u.r + Math.sin(u.t * 6) * 2;
  glow(def.color, 22); ctx.strokeStyle = def.color; ctx.lineWidth = 2.5;
  ctx.rotate(u.t * 1.5);
  ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; ctx.lineTo(Math.cos(a) * pr, Math.sin(a) * pr); } ctx.closePath();
  ctx.fillStyle = def.color + '30'; ctx.fill(); ctx.stroke();
  ctx.restore();
  drawText(def.label, u.x, u.y + 1, 15, '#ffffff', 'center', 10);
  if (u.isNew) {
    const s = 1 + 0.15 * Math.sin(u.t * 10);
    drawText('NEW!', u.x, u.y - u.r - 14, 13 * s, Math.floor(u.t * 6) % 2 ? '#ffdd55' : '#ffffff', 'center', 12);
  }
}

function drawHUD() {
  const L = SAFE.left + 14, T = SAFE.top + 8;
  const s = Math.max(15, Math.min(20, 18 * SCALE));
  const b = btnRects(), narrow = W < 520;
  const leftW = narrow ? b.mute.x - L - 10 : W * 0.35;
  drawText(`SCORE ${String(score).padStart(7, '0')}`, L, T + 14, s, '#00f0ff', 'left', 12, leftW);
  drawText(`HI ${String(highScore).padStart(7, '0')}`, L, T + 14 + s * 1.3, s * 0.75, '#ff2fd6', 'left', 10, leftW);
  const coinTxt = '● ' + coinCount;
  if (narrow) { drawText(`WAVE ${wave}`, L, T + 14 + s * 2.4, s * 0.75, '#ffdd55', 'left', 10); drawText(coinTxt, L + s * 5.2, T + 14 + s * 2.4, s * 0.75, '#ffd23f', 'left', 10); }
  else { drawText(`WAVE ${wave}`, W / 2, T + 14, s, '#ffdd55', 'center', 12); drawText(coinTxt, L, T + 14 + s * 2.4, s * 0.75, '#ffd23f', 'left', 10); }
  for (let i = 0; i < lives; i++) {
    ctx.save(); ctx.translate(W - SAFE.right - 24 - i * 26, b.pause.y + BTN + 20); ctx.scale(0.6, 0.6);
    glow('#00f0ff', 10); ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(13, 12); ctx.lineTo(-13, 12); ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  ctx.lineWidth = 2; glow('#ffffff', 6); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (const r of [b.pause, b.mute]) { rrect(r.x, r.y, r.w, r.h, 10); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const px = b.pause.x + BTN / 2, py = b.pause.y + BTN / 2;
  if (state === 'paused') { ctx.beginPath(); ctx.moveTo(px - 7, py - 10); ctx.lineTo(px + 10, py); ctx.lineTo(px - 7, py + 10); ctx.fill(); }
  else { ctx.fillRect(px - 9, py - 11, 6, 22); ctx.fillRect(px + 3, py - 11, 6, 22); }
  drawText(Sound.muted ? '×' : '♪', b.mute.x + BTN / 2, b.mute.y + BTN / 2 + 1, 26, Sound.muted ? '#ff3355' : '#ffffff', 'center', 6);

  // boss bar + name
  const boss = bossAlive();
  const bossY = narrow ? b.pause.y + BTN + 44 : T + 44;
  if (boss) {
    const bw = Math.min(500, W * 0.62), bx = (W - bw) / 2;
    drawText(boss.name, W / 2, bossY - 9, 12, boss.color, 'center', 8);
    ctx.strokeStyle = boss.color; glow(boss.color, 12); ctx.lineWidth = 2; ctx.strokeRect(bx, bossY, bw, 10);
    ctx.fillStyle = boss.raged ? '#ffffff' : boss.color; ctx.fillRect(bx + 2, bossY + 2, (bw - 4) * Math.max(0, boss.hp / boss.maxHp), 6);
  }
  // combo meter
  if (mult > 1 || combo > 1) {
    const cy = boss ? bossY + 34 : (narrow ? b.pause.y + BTN + 44 : T + 48);
    const pulse = 1 + 0.08 * Math.sin(time * 12);
    const cc = ['#fff', '#fff', '#39ff14', '#00f0ff', '#ffdd55', '#ff9f1c', '#ff2fd6', '#ff3355', '#ffffff'][mult];
    drawText('x' + mult, W / 2, cy, 24 * pulse, cc, 'center', 16);
    drawText(combo + ' COMBO', W / 2, cy + 18, 10, cc, 'center', 6);
    ctx.fillStyle = cc; ctx.fillRect(W / 2 - 30, cy + 27, 60 * clamp(comboTimer / 2.6, 0, 1), 3);
  }
  // power-up timers (bottom-left)
  let y = H - SAFE.bottom - 20;
  const p = player;
  for (const k of TIMED) {
    const v = p.pw[k]; if (v <= 0) continue;
    const def = POWERS[k];
    glow(def.color, 10); ctx.fillStyle = def.color;
    ctx.fillRect(L, y - 4, 100 * Math.min(1, v / def.dur), 6);
    ctx.strokeStyle = def.color; ctx.lineWidth = 1; ctx.strokeRect(L, y - 4, 100, 6);
    drawText(def.name, L + 108, y, 11, def.color, 'left', 6, W * 0.4);
    y -= 17;
  }
  // bomb button (bottom-right)
  const bb = bombBtn(), ready = p.bomb >= 1;
  ctx.lineWidth = 3;
  ctx.fillStyle = ready ? 'rgba(255,255,255,' + (0.15 + 0.1 * Math.sin(time * 8)) + ')' : 'rgba(255,255,255,0.05)';
  ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; glow('#ffffff', 0); ctx.stroke();
  ctx.strokeStyle = ready ? '#ffffff' : '#00f0ff'; glow(ready ? '#ffffff' : '#00f0ff', ready ? 22 : 8);
  ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, -Math.PI / 2, -Math.PI / 2 + TAU * p.bomb); ctx.stroke();
  drawText('BOMB', bb.x, bb.y - (isTouch ? 0 : 5), 12, ready ? '#ffffff' : 'rgba(160,220,255,0.7)', 'center', ready ? 14 : 4);
  if (!isTouch) drawText('[B]', bb.x, bb.y + 9, 9, 'rgba(200,220,255,0.6)', 'center', 0);
}

function drawBanner() {
  if (!banner) return;
  const b = banner, age = b.max - b.life;
  const inT = Math.min(1, age / 0.3), easeBack = 1 + 2.2 * Math.pow(inT - 1, 3) + 1.2 * Math.pow(inT - 1, 2);
  const a = Math.min(1, b.life / 0.4);
  ctx.globalAlpha = a;
  if (b.warn) {
    const on = Math.floor(time * 6) % 2 === 0;
    ctx.shadowBlur = 0; ctx.fillStyle = on ? 'rgba(255,40,70,0.22)' : 'rgba(255,40,70,0.08)';
    ctx.fillRect(0, H * 0.4 - 60, W, 120);
    ctx.fillStyle = 'rgba(255,40,70,0.7)';
    for (let x = -40 + (time * 120) % 40; x < W + 40; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, H * 0.4 - 60); ctx.lineTo(x + 20, H * 0.4 - 60); ctx.lineTo(x + 10, H * 0.4 - 50); ctx.lineTo(x - 10, H * 0.4 - 50); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x, H * 0.4 + 50); ctx.lineTo(x + 20, H * 0.4 + 50); ctx.lineTo(x + 10, H * 0.4 + 60); ctx.lineTo(x - 10, H * 0.4 + 60); ctx.fill();
    }
  }
  const size = Math.max(28, 46 * SCALE) * Math.max(0.2, easeBack);
  drawText(b.text, W / 2, H * 0.4 - 8, size, b.color, 'center', 30, W * 0.9);
  if (b.sub) drawText(b.sub, W / 2, H * 0.4 + size * 0.75, Math.max(14, 20 * SCALE), '#ffffff', 'center', 12, W * 0.9);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const boss = state !== 'title' && bossAlive();
  g.addColorStop(0, boss ? '#1a0215' : '#0a0220'); g.addColorStop(1, '#02000a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawStars(state === 'play' ? 1.4 : 1);
  ctx.strokeStyle = boss ? 'rgba(255,51,85,0.10)' : 'rgba(255,47,214,0.08)'; ctx.lineWidth = 1;
  const off = (time * 60) % 60;
  ctx.beginPath(); for (let y = off; y < H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();

  if (state !== 'title' && player) {
    // boss beams
    for (const bm of beams) {
      if (bm.warn > 0) {
        ctx.shadowBlur = 0; ctx.globalAlpha = Math.floor(time * 16) % 2 ? 0.7 : 0.25;
        ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(bm.x, 0); ctx.lineTo(bm.x, H); ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 0.12; ctx.fillStyle = '#ff3355'; ctx.fillRect(bm.x - bm.w / 2, 0, bm.w, H); ctx.globalAlpha = 1;
      } else {
        const wv = bm.w * (0.8 + 0.3 * Math.random());
        glow('#b04bff', 30); ctx.fillStyle = '#b04bff'; ctx.fillRect(bm.x - wv / 2, 0, wv, H);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(bm.x - wv / 5, 0, wv / 2.5, H);
      }
    }
    // coins
    ctx.shadowBlur = 0;
    const cs = coinSprite();
    if (state !== 'over') for (const c of coins) { if (c.life < 2 && Math.floor(c.life * 10) % 2) continue; blit(cs, c.x, c.y, Math.abs(Math.cos(c.t)) * 0.8 + 0.2, 1); }
    if (state !== 'over') for (const u of powerups) drawPower(u);
    for (const e of enemies) drawEnemy(e);
    // missiles
    glow('#ff9f1c', 12); ctx.fillStyle = '#ffe0b0';
    for (const m of missiles) { ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx)); ctx.fillRect(-6, -2, 12, 4); ctx.restore(); }
    ctx.shadowBlur = 0;
    // player bullets
    const bs = boltSprite(player.pw.spread > 0 ? '#3fb8ff' : player.pw.rapid > 0 ? '#39ff14' : '#7ff9ff');
    for (const b of bullets) blit(bs, b.x, b.y);
    // laser
    if (player.lasering) {
      const p = player, bw = (12 * SCALE + 6) * (0.85 + 0.3 * Math.random());
      const lg = ctx.createLinearGradient(p.x - bw, 0, p.x + bw, 0);
      lg.addColorStop(0, 'rgba(255,42,109,0)'); lg.addColorStop(0.3, 'rgba(255,42,109,0.85)'); lg.addColorStop(0.5, '#ffffff');
      lg.addColorStop(0.7, 'rgba(255,42,109,0.85)'); lg.addColorStop(1, 'rgba(255,42,109,0)');
      ctx.fillStyle = lg; ctx.fillRect(p.x - bw, 0, bw * 2, p.y - 18 * SCALE);
      if (Math.random() < 0.6) particles.push({ x: p.x + rand(-bw / 2, bw / 2), y: rand(0, p.y), vx: rand(-60, 60), vy: rand(-40, 40), life: 0.25, max: 0.25, color: '#ff2a6d', size: 2, streak: false });
    }
    // enemy bullets
    for (const b of eBullets) blit(orbSprite(b.color, b.r), b.x, b.y);
  }

  // particles + rings (additive)
  ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0;
  ctx.lineCap = 'round';
  for (const pt of particles) {
    const a = Math.max(0, pt.life / pt.max);
    ctx.globalAlpha = a;
    if (pt.streak) {
      ctx.strokeStyle = pt.color; ctx.lineWidth = pt.size;
      ctx.beginPath(); ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x - pt.vx * 0.045, pt.y - pt.vy * 0.045); ctx.stroke();
    } else { ctx.fillStyle = pt.color; ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size); }
  }
  for (const r of rings) {
    const k = 1 - r.life / r.maxLife, rad = r.max * (1 - Math.pow(1 - k, 3));
    ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = r.color; ctx.lineWidth = r.width * (1 - k) + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.lineCap = 'butt';

  if (state !== 'title' && player && state !== 'over') {
    const p = player;
    const blink = p.invuln > 0 && Math.floor(time * 15) % 2 === 0;
    drawShip(p.x, p.y, p.tilt, blink ? 0.3 : 1);
    if (p.pw.shield > 0 && !(p.pw.shield < 2 && Math.floor(time * 10) % 2 === 0)) {
      glow('#ff66ff', 25); ctx.strokeStyle = '#ff66ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 28 * SCALE + Math.sin(time * 8) * 2, 0, TAU); ctx.stroke();
    }
    if (p.pw.magnet > 0) { ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,230,0,0.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, 40 + (time * 60) % 30, 0, TAU); ctx.stroke(); }
  }
  // floaters (scale pop)
  for (const f of floaters) {
    const age = f.max - f.life, pop = age < 0.12 ? 1 + (0.12 - age) * 5 : 1;
    ctx.globalAlpha = clamp(f.life / 0.3, 0, 1);
    ctx.font = `bold ${f.size * pop}px "Courier New", monospace`;
    const hw = Math.min(W * 0.45, ctx.measureText(f.text).width / 2 + 8);
    drawText(f.text, clamp(f.x, hw, W - hw), f.y, f.size * pop, f.color, 'center', 10, W * 0.9);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.shadowBlur = 0; ctx.fillStyle = `rgba(${flashColor},${Math.min(0.8, flash * 0.6)})`; ctx.fillRect(0, 0, W, H); }
  if (slowmo > 0 && state === 'play') { ctx.shadowBlur = 0; const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(60,0,40,0.5)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }

  if ((state === 'play' || state === 'paused') && player) { drawHUD(); drawBanner(); }

  const big = Math.max(40, 72 * SCALE), mid = Math.max(18, 24 * SCALE), small = Math.max(12, 15 * SCALE), FW = W * 0.9;
  if (state === 'title') {
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    drawText('STAR', W / 2, H * 0.22, big, '#00f0ff', 'center', 40, FW);
    drawText('SHOOTER', W / 2, H * 0.22 + big, big, '#ff2fd6', 'center', 40, FW);
    drawText('COMBOS • COINS • 7 POWER-UPS • BOSSES', W / 2, H * 0.22 + big * 1.75, small, '#ffdd55', 'center', 10, FW);
    // power-up showcase
    const keysP = Object.keys(POWERS), gap = Math.min(46, (W * 0.85) / keysP.length);
    keysP.forEach((k, i) => {
      const x = W / 2 + (i - (keysP.length - 1) / 2) * gap, y = H * 0.47 + Math.sin(time * 3 + i) * 5, d = POWERS[k];
      glow(d.color, 16); ctx.strokeStyle = d.color; ctx.lineWidth = 2;
      ctx.beginPath(); for (let j = 0; j < 6; j++) { const a = j / 6 * TAU + time; ctx.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); } ctx.closePath(); ctx.stroke();
      drawText(d.label, x, y + 1, 13, '#ffffff', 'center', 8);
    });
    drawShip(W / 2, H * 0.58 + Math.sin(time * 2) * 8, Math.sin(time), 1);
    ctx.globalAlpha = 0.4 + 0.6 * pulse;
    drawText(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, H * 0.68, mid * (isTouch ? 1.3 : 1), '#ffffff', 'center', 20, FW);
    ctx.globalAlpha = 1;
    if (isTouch) {
      drawText('DRAG ANYWHERE TO MOVE', W / 2, H * 0.76, small, '#8ab4ff', 'center', 8, FW);
      drawText('AUTO-FIRE WHILE TOUCHING • TAP BOMB WHEN CHARGED', W / 2, H * 0.76 + small * 1.6, small, '#8ab4ff', 'center', 8, FW);
    } else {
      drawText('MOVE: ARROWS / WASD   SHOOT: SPACE   BOMB: B', W / 2, H * 0.76, small, '#8ab4ff', 'center', 8, FW);
      drawText('PAUSE: P   MUTE: M   MUSIC: N', W / 2, H * 0.76 + small * 1.6, small, '#8ab4ff', 'center', 8, FW);
    }
    drawText(`HIGH SCORE ${highScore}`, W / 2, H - SAFE.bottom - Math.max(30, H * 0.08), mid, '#ffdd55', 'center', 14, FW);
  } else if (state === 'paused') {
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(5,1,15,0.6)'; ctx.fillRect(0, 0, W, H);
    drawText('PAUSED', W / 2, H * 0.45, big, '#00f0ff', 'center', 30, FW);
    drawText(isTouch ? 'TAP TO RESUME' : 'PRESS P TO RESUME', W / 2, H * 0.45 + big, mid, '#ffffff', 'center', 12, FW);
  } else if (state === 'over') {
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(5,1,15,0.55)'; ctx.fillRect(0, 0, W, H);
    const y0 = H * 0.26;
    drawText('GAME OVER', W / 2, y0, big, '#ff3355', 'center', 40, FW);
    drawText(`SCORE ${score.toLocaleString()}`, W / 2, y0 + big * 1.1, mid * 1.3, '#00f0ff', 'center', 16, FW);
    drawText(`WAVE ${wave}   ● ${coinCount}   BEST x${bestMult}`, W / 2, y0 + big * 1.1 + mid * 1.8, mid * 0.8, '#ffdd55', 'center', 12, FW);
    drawText(newHigh ? '★ NEW HIGH SCORE ★' : `HIGH SCORE ${highScore.toLocaleString()}`, W / 2, y0 + big * 1.1 + mid * 3.3, mid, '#ff2fd6', 'center', 16, FW);
    if (overTimer <= 0) {
      ctx.globalAlpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * 4));
      drawText(isTouch ? 'TAP TO RESTART' : 'PRESS SPACE TO RESTART', W / 2, H * 0.72, mid * (isTouch ? 1.2 : 1), '#ffffff', 'center', 16, FW);
      ctx.globalAlpha = 1;
    }
  }
  ctx.shadowBlur = 0;
}

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
